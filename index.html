<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    #art {
      position: fixed; top: 50%; left: 50%;
      width: 60vmin; transform: translate(-50%, -50%);
      pointer-events: none;
    }
    #start {
      position: fixed; inset: 0; margin: auto; width: 200px; height: 60px;
      font-size: 20px;
    }
  </style>
</head>
<body>
  <video id="cam" autoplay playsinline muted></video>
  <video id="art" src="sakuhin.mp4" loop muted playsinline></video>
  <button id="start">カメラをはじめる</button>

  <script>
    document.getElementById('start').addEventListener('click', async () => {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } }, // 背面カメラ
        audio: false
      });
      document.getElementById('cam').srcObject = stream;
      document.getElementById('art').play();
      document.getElementById('start').remove();
    });
  </script>
</body>
</html>
